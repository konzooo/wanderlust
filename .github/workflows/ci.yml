name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ConvexBackend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ConvexBackend/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm audit --omit=dev --audit-level=high

  ios:
    name: iOS tests and Release build
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Select the release Xcode version
        run: sudo xcode-select -s /Applications/Xcode_26.2.app
      - name: Resolve Swift packages
        run: xcodebuild -resolvePackageDependencies -project Wanderlust.xcodeproj -scheme Wanderlust
      - name: Run unit tests
        run: >-
          xcodebuild test
          -project Wanderlust.xcodeproj
          -scheme Wanderlust
          -destination 'platform=iOS Simulator,name=iPhone 17 Pro,OS=26.2'
          -only-testing:WanderlustTests
      - name: Build the App Store configuration
        run: >-
          xcodebuild build
          -project Wanderlust.xcodeproj
          -scheme Wanderlust
          -configuration Release
          -destination 'generic/platform=iOS'
          CODE_SIGNING_ALLOWED=NO
