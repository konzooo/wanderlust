<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Join your Wanderlust group trip</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      font-family: -apple-system, system-ui, sans-serif;
      background: linear-gradient(160deg, #EEF1FF, #FFFFFF 45%, #FFF6E6);
      color: #1c1c1e;
    }
    .card {
      max-width: 380px; margin: 24px; padding: 32px 28px; text-align: center;
      background: rgba(255,255,255,0.75); border-radius: 24px;
      box-shadow: 0 20px 60px rgba(80,80,160,0.15); backdrop-filter: blur(12px);
    }
    h1 { font-size: 22px; margin: 0 0 8px; }
    p { color: #6b6b70; line-height: 1.5; margin: 0 0 20px; }
    .code { font-size: 30px; letter-spacing: 6px; font-weight: 700; margin: 4px 0 22px; }
    .btn {
      display: inline-block; padding: 14px 26px; border-radius: 14px;
      background: #5B5BD6; color: #fff; text-decoration: none; font-weight: 600;
    }
    .hint { font-size: 13px; margin-top: 16px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>You're invited on a group trip ✈️</h1>
    <p>Open this in the Wanderlust app to join and add your travel preferences.</p>
    <div class="code" id="code">—</div>
    <a class="btn" href="#" id="open">Open in Wanderlust</a>
    <p class="hint">Don't have the app yet? Install Wanderlust, then enter the invite ID above under <b>Group Trip → Join Trip</b>.</p>
  </div>
  <script>
    // The invite code is the last path segment: /join/<code>
    var code = location.pathname.split('/').filter(Boolean).pop() || '';
    document.getElementById('code').textContent = code;
    // Fallback deep link into the app via the custom scheme.
    document.getElementById('open').href = 'wanderlust://join/' + encodeURIComponent(code);
  </script>
</body>
</html>
